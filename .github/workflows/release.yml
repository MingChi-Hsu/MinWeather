name: Release

# Runs when a version tag such as v1.0.1 is pushed
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # Needed to create the GitHub Release

jobs:
  release:
    name: Build signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # v1.2.3 -> versionName 1.2.3, versionCode 1 * 10000 + 2 * 100 + 3 = 10203
      - name: Work out version from tag
        id: version
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must look like v1.2.3"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::Minor and patch must be 99 or less"
            exit 1
          fi
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - name: Restore upload keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build signed bundle
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testReleaseUnitTest bundleRelease \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}
          mv app/build/outputs/bundle/release/app-release.aab \
            "MinWeather-${{ steps.version.outputs.name }}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MinWeather ${{ steps.version.outputs.name }}
          files: MinWeather-${{ steps.version.outputs.name }}.aab
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
